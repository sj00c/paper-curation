schema_version: 1
name: paper-curation
runtime:
  default_mode: local
  python:
    version: "3.12"
  claude_code:
    minimum_version: "2.1.205"
providers:
  source:
    zotero:
      transports:
        local-sqlite:
          credential_required: false
        zotero-storage:
          credential_required: true
          credential_environment:
            - ZOTERO_API_KEY
  review:
    claude-code-oauth:
      cost: REMOTE_UNMETERED
      credential_environment:
        - CLAUDE_CODE_OAUTH_TOKEN
    anthropic-api:
      cost: METERED
      credential_environment:
        - ANTHROPIC_API_KEY
    local-model:
      cost: LOCAL
  enhancement:
    google:
      cost: METERED
      credential_environment:
        - GOOGLE_API_KEY
        - GEMINI_API_KEY
    openai:
      cost: METERED
      credential_environment:
        - OPENAI_API_KEY
defaults:
  features_enabled: false
publication:
  default_mode: local
  configuration:
    mode: publication.mode
    base_url: publication.base_url
  actions:
    deploy:
      selection: explicit-public
      provider: publication.provider
      config_path: publication.config_path
outputs:
  workspace_root: workspace.root
  committed_papers: papers/
  local_site: site/
  local_url: http://localhost:8000/
  public_url: "{publication.base_url}/"
