name: tests

# Run the product contract tests without downloading the optional clustering
# stack; focused tests use synthetic fixtures for those boundaries.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (heavy clustering stack excluded)
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(umap-learn|hdbscan|sentence-transformers)\s*$' requirements.txt > /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt pytest

      - name: pytest
        run: PYTHONUTF8=1 python -m pytest pipeline/tests -q

  line-endings:
    # Preserve each changed file's existing EOL convention.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 줄바꿈만 바뀐 변경 차단
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          echo "base=$base"
          fail=0
          for f in $(git diff --name-only "$base" HEAD); do
            git cat-file -e "$base:$f" 2>/dev/null || continue
            [ -f "$f" ] || continue
            old="$(git show "$base:$f" | head -c 200000)"
            case "$old" in *$'\r'*) old_eol=crlf ;; *) old_eol=lf ;; esac
            new="$(head -c 200000 "$f")"
            case "$new" in *$'\r'*) new_eol=crlf ;; *) new_eol=lf ;; esac
            if [ "$old_eol" != "$new_eol" ]; then
              echo "::error file=$f::줄바꿈이 $old_eol → $new_eol 로 바뀌었습니다. scripts/check-eol.py --fix 로 되돌리세요."
              fail=1
            fi
          done
          exit $fail

  npx-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node --test
        run: npm run test:npx-cli
