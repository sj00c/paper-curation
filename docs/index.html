<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Curation</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; }
    main { width: min(42rem, calc(100% - 3rem)); padding: 3rem; border: 1px solid #334155; border-radius: 1rem; background: #111827; }
    h1 { margin-top: 0; font-size: clamp(2rem, 7vw, 4rem); }
    p { line-height: 1.7; color: #cbd5e1; }
    code { padding: .15rem .4rem; border-radius: .3rem; background: #1e293b; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <main>
    <h1>Paper Curation</h1>
    <p>학술 논문을 로컬에서 리뷰·분류하고 검색 가능한 대시보드로 만드는 도구입니다.</p>
    <p>설치 상태는 <code>paper-curation inspect</code>로 확인하고, 생성된 토픽은 <code>http://localhost:8000/&lt;topic&gt;/</code>에서 엽니다.</p>
    <p><a href="https://github.com/jehyunlee/paper-curation">소스와 설치 안내</a></p>
  </main>
</body>
</html>
