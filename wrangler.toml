#:schema node_modules/wrangler/config-schema.json
# Cloudflare Workers with Static Assets + /api/embed function.
# Docs: https://developers.cloudflare.com/workers/static-assets/binding/

name = "paper-curation"
compatibility_date = "2026-04-11"
main = "./worker/index.js"

[assets]
directory = "./docs"
binding = "ASSETS"

# Protect the operator-funded query-embedding API from anonymous quota abuse.
[[unsafe.bindings]]
name = "EMBED_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Secrets (set with `npx wrangler secret put <NAME>`):
